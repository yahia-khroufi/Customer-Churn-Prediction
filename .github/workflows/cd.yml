name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: customer-churn-deployments
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy dev
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: dev
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Train and save model for the image
        run: python run_pipeline.py --evaluate

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: deploy/terraform
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.AZURE_TFSTATE_KEY || 'customer-churn-dev.tfstate' }}"

      - name: Deploy dev
        working-directory: deploy/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_registry_name: ${{ vars.AZURE_REGISTRY_NAME }}
          TF_VAR_environment_name: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
          TF_VAR_app_name: ${{ vars.AZURE_CONTAINER_APP }}
          TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
          TF_VAR_build_image: "true"
        run: terraform apply -auto-approve -input=false

  deploy-staging:
    name: Deploy staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Train and save model for the image
        run: python run_pipeline.py --evaluate

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: deploy/terraform
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.AZURE_TFSTATE_KEY || 'customer-churn-staging.tfstate' }}"

      - name: Deploy staging
        working-directory: deploy/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_registry_name: ${{ vars.AZURE_REGISTRY_NAME }}
          TF_VAR_environment_name: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
          TF_VAR_app_name: ${{ vars.AZURE_CONTAINER_APP }}
          TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
          TF_VAR_build_image: "true"
        run: terraform apply -auto-approve -input=false

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Train and save model for the image
        run: python run_pipeline.py --evaluate

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: deploy/terraform
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.AZURE_TFSTATE_KEY || 'customer-churn-production.tfstate' }}"

      - name: Deploy production
        working-directory: deploy/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_registry_name: ${{ vars.AZURE_REGISTRY_NAME }}
          TF_VAR_environment_name: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
          TF_VAR_app_name: ${{ vars.AZURE_CONTAINER_APP }}
          TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
          TF_VAR_build_image: "true"
        run: terraform apply -auto-approve -input=false
