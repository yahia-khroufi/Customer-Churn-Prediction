name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: customer-churn-deployments
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: deploy/terraform
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.AZURE_TFSTATE_KEY }}"

      - name: Deploy dev
        working-directory: deploy/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_registry_name: ${{ vars.AZURE_REGISTRY_NAME }}
          TF_VAR_environment_name: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
          TF_VAR_app_name: ${{ vars.AZURE_CONTAINER_APP }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_build_image: "true"
        run: terraform apply -auto-approve -input=false

  deploy-staging:
    name: Deploy staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Deploy staging
        working-directory: deploy/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_registry_name: ${{ vars.AZURE_REGISTRY_NAME }}
          TF_VAR_environment_name: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
          TF_VAR_app_name: ${{ vars.AZURE_CONTAINER_APP }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_build_image: "true"
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.AZURE_TFSTATE_KEY }}"
          && terraform apply -auto-approve -input=false

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Deploy production
        working-directory: deploy/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_registry_name: ${{ vars.AZURE_REGISTRY_NAME }}
          TF_VAR_environment_name: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
          TF_VAR_app_name: ${{ vars.AZURE_CONTAINER_APP }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_build_image: "true"
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.AZURE_TFSTATE_KEY }}"
          && terraform apply -auto-approve -input=false
